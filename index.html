<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>efault-web</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <div id="page-wrapper">
    <div id="desktop">
      <div id="terminal-window">
        <div id="title-bar">
          <span>MS-DOS Prompt</span>
          <div id="title-buttons">
            <div class="button">_</div>
            <div class="button">□</div>
            <div class="button">X</div>
          </div>
        </div>
        <div id="terminal">
          <div id="terminal-output"></div>
          <div id="input-line">
            <span id="prompt">C:\></span>
            <input type="text" id="cmdline" autocomplete="off" autofocus />
          </div>
        </div>
      </div>
      <div id="gif-gallery">
        <img src="gifs/gif1.gif" alt="gif1" class="gif gif1" />
        <img src="gifs/gif2.gif" alt="gif2" class="gif gif2" />
        <img src="gifs/gif3.gif" alt="gif3" class="gif gif3" />
        <img src="gifs/ride.gif" alt="ride" class="gif ride" />
        <img src="gifs/glitch.gif" alt="old" class="gif old" />
      </div>
    </div>
  </div>

  <script src="js/script.js"></script>
</body>
</html>
